_schema-version: 3.3.0
ID: int-devops
version: 0.0.1
description: "SAP Integration Suite DevOps Utilities"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm run build-info # update build timestamp
        # - npm ci # run npm ci after checking out repo or npm install after updating package.json, instead of during build

modules:
  - name: int-devops-srv
    type: nodejs
    path: ./
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
      instances: 1 # TODO: minimal 2 in case one instance crash the other one can take over (multi-AZ)
      memory: 128M
      disk-quota: 1G
      keep-existing-routes: true
      enable-ssh: true # for development/troubleshooting
      host: int-devops-${org}
    properties:
      LOG_LEVEL: "debug" # log level for proxy module, possible values: [trace|debug|info|warn|error|silent]
      PRETTY_RESPONSE: "true" # [true|false]
      REDACT_AUTH_HEADER: "true" # [true|false]
      # TMS_URL: "https://transport-service-app-backend.ts.cfapps.us10.hana.ondemand.com"
      # REPO_URL: <YOUR_GIT_REPO_URL_WITH_KEY>
    build-parameters:
      builder: npm-ci
      ignore: [".git/","node_modules/","mta_archives/","upload/","work/","test/","tmp/","default-*.json",".env"]                  

