_schema-version: 3.3.0
ID: int-devops
version: 0.8.0
description: "SAP Integration Suite DevOps Utilities"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm run build-info # update build timestamp
        # - npm ci # run npm ci after checking out repo or npm install after updating package.json, instead of during build
        - npx -p @sap/cds-dk cds build --production
      
modules:
  - name: int-devops-ui
    type: html5
    path: app/ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []    

  - name: int-devops-app
    type: approuter.nodejs
    path: app
    requires:
      - name: int-devops-xsuaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          timeout: 600000
          forwardAuthToken: true
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
      instances: 1 # TODO: minimal 2 in case one instance crash the other one can take over (multi-AZ)
      memory: 128M
      disk-quota: 1G
      keep-existing-routes: true
      enable-ssh: true # for development/troubleshooting
      host: int-devops-${org}
    properties:
      CF_NODEJS_LOGGING_LEVEL: "error"
      XS_APP_LOG_LEVEL: "error"
      LOG_LEVEL: "debug" # log level for custom-app, possible values: [trace|debug|info|warn|error|silent]
      LOG_PRETTY: "true" # [true|false]
      LOG_REDACT: "true" # [true|false]
      # TMS_URL: "https://transport-service-app-backend.ts.cfapps.us10.hana.ondemand.com"
      # REPO_URL: <YOUR_GIT_REPO_URL_WITH_KEY>
    build-parameters:
      builder: custom
      commands: []
      ignore: ["node_modules/","default-*.json","*.env"]      

  - name: int-devops-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: int-devops-xsuaa
      - name: int-devops-destination
    parameters:
      memory: 256M
      disk-quota: 1024M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    build-parameters:
      builder: custom
      commands: []
      ignore: ["node_modules/","default-*.json","*.env"]      

resources:
  - name: int-devops-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        xsappname: int-devops-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application

  - name: int-devops-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
      service: destination
      service-plan: lite